version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: biorag-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
      - FAISS_INDEX_DIR=/app/data/indices/faiss
      - BM25_INDEX_PATH=/app/data/indices/bm25/bm25.pkl
      - MANIFEST_DB_PATH=/app/data/metadata.db
      - RAW_PAPERS_DIR=/app/data/raw/papers
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: biorag-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
